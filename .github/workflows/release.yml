name: Release

on:
  push:
    branches:
      - main
  # escape hatch: re-run the publish leg manually when it failed after
  # release-please has already created the GitHub Release and tag
  # (re-running the failed job would reuse the old workflow definition)
  workflow_dispatch:

permissions: {}   # zero default permissions; grant per job

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push release PR branch, create GitHub Release/tag
      pull-requests: write   # create/update/label release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: npm              # must match the Environment name of the npm Trusted Publisher
    permissions:
      contents: read
      id-token: write        # required for OIDC token exchange
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # full history: tests depend on git history and tags
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # deliberately no dependency caching in the release build (cache poisoning mitigation)

      - name: Install npm with staged publishing + OIDC support
        # exact-pinned on purpose; review manually when bumping
        run: npm install -g npm@11.15.0 # zizmor: ignore[adhoc-packages]

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build and verify distribution
        run: npm run rebuild

      - name: Staged publish to npm with provenance
        run: npm stage publish
